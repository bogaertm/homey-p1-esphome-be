# Integratietest: laadt de productieconfig en vervangt enkel de hardware door het
# Linux host platform met een virtuele seriele poort (gesimuleerde Fluvius meter).
# Wordt gestart door run_test.py, dat build/productie-host.yaml aanmaakt.
packages:
  productie: !include build/productie-host.yaml

esphome:
  on_boot: !remove
  includes:
    - psa_stubs.h
  platformio_options:
    build_flags:
      - -Wl,--no-as-needed
      - -lmbedcrypto

host:
esp32: !remove
wifi: !remove
captive_portal: !remove
improv_serial: !remove
web_server: !remove
ota: !remove
switch: !remove
light: !remove

uart:
  - id: !extend uart_p1
    rx_pin: !remove
    port: /tmp/p1-sim

sensor:
  - id: !remove wifi_rssi
