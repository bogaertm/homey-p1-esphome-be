# Growatt meter emulator: ESP32 met RS485 bij de omvormer die zich voordoet als
# Eastron SDM630 (3 fasen) of SDM230 (1 fase). De meetwaarden komen draadloos van de
# Homey Energy Dongle aan de digitale meter (homey-p1-be-growatt-link.yaml).
#
# GEGENEREERD door tools/genereer_emulator.py: pas registers daar aan, niet hier.
#
# Hardware: Waveshare ESP32-S3-RS485-CAN (DIN rail, geisoleerde RS485, 7 tot 36 V DC)
#   RS485 A en B naar de meteringang van de Growatt (bv. SYS COM pin 5 = A, pin 6 = B)
#
# Enkel voor eigenverbruik en batterijsturing. NIET gebruiken als wettelijk verplichte
# injectiebegrenzing: daarvoor eist Fluvius een begrenzer van de Synergrid C10/25 lijst.

substitutions:
  name: growatt-meter
  friendly_name: Growatt meter
  # 2 = SDM630 v2 (3 fasen, standaard bij Growatt), 1 = SDM230 (1 fase), 3 = SDM630 v3
  meter_adres: "2"
  # Na zoveel ms zonder nieuw telegram stopt de emulator met antwoorden (failsafe)
  failsafe_ms: "5000"
  # Naam van de dongle (esphome name in homey-p1-be.yaml)
  p1_dongle: homey-p1
  rs485_tx: GPIO17
  rs485_rx: GPIO18
  rs485_de: GPIO21

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.0
  project:
    name: btechnics.growatt-meter-emulator
    version: "1.0.0"

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  batch_delay: 0ms
  encryption:
    key: !secret api_key_emulator

ota:
  - platform: esphome
    encryption:
      key: !secret api_key_emulator

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  ap:
    ssid: "${name} fallback"
    password: !secret ap_password

captive_portal:

web_server:
  port: 80
  version: 3
  ota: false

globals:
  # Berekende registerwaarden, in dezelfde volgorde als de registers hieronder
  - id: reg
    type: std::array<float, 25>
    restore_value: false
  - id: laatste_seq
    type: float
    restore_value: false
    initial_value: "-1"
  - id: laatste_ontvangst
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: telegrammen
    type: uint32_t
    restore_value: false
    initial_value: "0"

# ---------------------------------------------------------------- link met de dongle --
udp:
  id: p1_udp
  port: 18511

packet_transport:
  - platform: udp
    udp_id: p1_udp
    providers:
      - name: ${p1_dongle}
        encryption:
          key: !secret p1_link_key

# --------------------------------------------------------------------------- RS485 --
uart:
  - id: uart_rs485
    tx_pin: ${rs485_tx}
    rx_pin: ${rs485_rx}
    baud_rate: 9600
    data_bits: 8
    parity: NONE
    stop_bits: 1
    # Zet logger op DEBUG om alle vragen van de omvormer te zien (handig bij de eerste installatie)
    debug:
      direction: BOTH
      dummy_receiver: false

modbus:
  - id: rs485
    uart_id: uart_rs485
    role: server
    flow_control_pin: ${rs485_de}

modbus_server:
  - id: sdm
    modbus_id: rs485
    address: ${meter_adres}
    # Niet ingevulde registers geven 0 terug, zoals een echte SDM630
    courtesy_response:
      enabled: true
      register_last_address: 0x017F
      register_value: 0
    # Elk register: geen verse data van de dongle = foutmelding naar de omvormer
    registers:
      # 30001 Spanning L1 (V)
      - address: 0x0000
        value_type: FP32
        read_lambda: |-
          if (id(laatste_ontvangst) == 0 || millis() - id(laatste_ontvangst) > ${failsafe_ms}) return {};
          return id(reg)[0];
      # 30003 Spanning L2 (V)
      - address: 0x0002
        value_type: FP32
        read_lambda: |-
          if (id(laatste_ontvangst) == 0 || millis() - id(laatste_ontvangst) > ${failsafe_ms}) return {};
          return id(reg)[1];
      # 30005 Spanning L3 (V)
      - address: 0x0004
        value_type: FP32
        read_lambda: |-
          if (id(laatste_ontvangst) == 0 || millis() - id(laatste_ontvangst) > ${failsafe_ms}) return {};
          return id(reg)[2];
      # 30007 Stroom L1 (A)
      - address: 0x0006
        value_type: FP32
        read_lambda: |-
          if (id(laatste_ontvangst) == 0 || millis() - id(laatste_ontvangst) > ${failsafe_ms}) return {};
          return id(reg)[3];
      # 30009 Stroom L2 (A)
      - address: 0x0008
        value_type: FP32
        read_lambda: |-
          if (id(laatste_ontvangst) == 0 || millis() - id(laatste_ontvangst) > ${failsafe_ms}) return {};
          return id(reg)[4];
      # 30011 Stroom L3 (A)
      - address: 0x000A
        value_type: FP32
        read_lambda: |-
          if (id(laatste_ontvangst) == 0 || millis() - id(laatste_ontvangst) > ${failsafe_ms}) return {};
          return id(reg)[5];
      # 30013 Vermogen L1 (W), afname positief, injectie negatief
      - address: 0x000C
        value_type: FP32
        read_lambda: |-
          if (id(laatste_ontvangst) == 0 || millis() - id(laatste_ontvangst) > ${failsafe_ms}) return {};
          return id(reg)[6];
      # 30015 Vermogen L2 (W)
      - address: 0x000E
        value_type: FP32
        read_lambda: |-
          if (id(laatste_ontvangst) == 0 || millis() - id(laatste_ontvangst) > ${failsafe_ms}) return {};
          return id(reg)[7];
      # 30017 Vermogen L3 (W)
      - address: 0x0010
        value_type: FP32
        read_lambda: |-
          if (id(laatste_ontvangst) == 0 || millis() - id(laatste_ontvangst) > ${failsafe_ms}) return {};
          return id(reg)[8];
      # 30019 Schijnbaar vermogen L1 (VA)
      - address: 0x0012
        value_type: FP32
        read_lambda: |-
          if (id(laatste_ontvangst) == 0 || millis() - id(laatste_ontvangst) > ${failsafe_ms}) return {};
          return id(reg)[9];
      # 30021 Schijnbaar vermogen L2 (VA)
      - address: 0x0014
        value_type: FP32
        read_lambda: |-
          if (id(laatste_ontvangst) == 0 || millis() - id(laatste_ontvangst) > ${failsafe_ms}) return {};
          return id(reg)[10];
      # 30023 Schijnbaar vermogen L3 (VA)
      - address: 0x0016
        value_type: FP32
        read_lambda: |-
          if (id(laatste_ontvangst) == 0 || millis() - id(laatste_ontvangst) > ${failsafe_ms}) return {};
          return id(reg)[11];
      # 30031 Arbeidsfactor L1
      - address: 0x001E
        value_type: FP32
        read_lambda: |-
          if (id(laatste_ontvangst) == 0 || millis() - id(laatste_ontvangst) > ${failsafe_ms}) return {};
          return id(reg)[12];
      # 30033 Arbeidsfactor L2
      - address: 0x0020
        value_type: FP32
        read_lambda: |-
          if (id(laatste_ontvangst) == 0 || millis() - id(laatste_ontvangst) > ${failsafe_ms}) return {};
          return id(reg)[13];
      # 30035 Arbeidsfactor L3
      - address: 0x0022
        value_type: FP32
        read_lambda: |-
          if (id(laatste_ontvangst) == 0 || millis() - id(laatste_ontvangst) > ${failsafe_ms}) return {};
          return id(reg)[14];
      # 30043 Gemiddelde spanning (V)
      - address: 0x002A
        value_type: FP32
        read_lambda: |-
          if (id(laatste_ontvangst) == 0 || millis() - id(laatste_ontvangst) > ${failsafe_ms}) return {};
          return id(reg)[15];
      # 30047 Gemiddelde stroom (A)
      - address: 0x002E
        value_type: FP32
        read_lambda: |-
          if (id(laatste_ontvangst) == 0 || millis() - id(laatste_ontvangst) > ${failsafe_ms}) return {};
          return id(reg)[16];
      # 30049 Som van de stromen (A)
      - address: 0x0030
        value_type: FP32
        read_lambda: |-
          if (id(laatste_ontvangst) == 0 || millis() - id(laatste_ontvangst) > ${failsafe_ms}) return {};
          return id(reg)[17];
      # 30053 Totaal vermogen (W), afname positief
      - address: 0x0034
        value_type: FP32
        read_lambda: |-
          if (id(laatste_ontvangst) == 0 || millis() - id(laatste_ontvangst) > ${failsafe_ms}) return {};
          return id(reg)[18];
      # 30057 Totaal schijnbaar vermogen (VA)
      - address: 0x0038
        value_type: FP32
        read_lambda: |-
          if (id(laatste_ontvangst) == 0 || millis() - id(laatste_ontvangst) > ${failsafe_ms}) return {};
          return id(reg)[19];
      # 30063 Totale arbeidsfactor
      - address: 0x003E
        value_type: FP32
        read_lambda: |-
          if (id(laatste_ontvangst) == 0 || millis() - id(laatste_ontvangst) > ${failsafe_ms}) return {};
          return id(reg)[20];
      # 30071 Frequentie (Hz), zit niet in P1, nominaal 50 Hz
      - address: 0x0046
        value_type: FP32
        read_lambda: |-
          if (id(laatste_ontvangst) == 0 || millis() - id(laatste_ontvangst) > ${failsafe_ms}) return {};
          return id(reg)[21];
      # 30073 Afname totaal (kWh)
      - address: 0x0048
        value_type: FP32
        read_lambda: |-
          if (id(laatste_ontvangst) == 0 || millis() - id(laatste_ontvangst) > ${failsafe_ms}) return {};
          return id(reg)[22];
      # 30075 Injectie totaal (kWh)
      - address: 0x004A
        value_type: FP32
        read_lambda: |-
          if (id(laatste_ontvangst) == 0 || millis() - id(laatste_ontvangst) > ${failsafe_ms}) return {};
          return id(reg)[23];
      # 30343 Totale actieve energie (kWh)
      - address: 0x0156
        value_type: FP32
        read_lambda: |-
          if (id(laatste_ontvangst) == 0 || millis() - id(laatste_ontvangst) > ${failsafe_ms}) return {};
          return id(reg)[24];

script:
  # Rekent alle registerwaarden 1 keer uit per nieuw telegram
  - id: bereken
    then:
      - lambda: |-
          auto w = [](sensor::Sensor *s) -> float {
            return (s->has_state() && !std::isnan(s->state)) ? s->state : 0.0f;
          };
          auto va = [&](sensor::Sensor *u, sensor::Sensor *i) -> float { return w(u) * w(i); };
          auto pf = [](float p, float s) -> float {
            if (s < 1.0f) return 1.0f;
            float f = p / s;
            return f > 1.0f ? 1.0f : (f < -1.0f ? -1.0f : f);
          };
          sensor::Sensor *u_l1 = id(s_u_l1), *u_l2 = id(s_u_l2), *u_l3 = id(s_u_l3);
          sensor::Sensor *i_l1 = id(s_i_l1), *i_l2 = id(s_i_l2), *i_l3 = id(s_i_l3);
          sensor::Sensor *p_l1 = id(s_p_l1), *p_l2 = id(s_p_l2), *p_l3 = id(s_p_l3);
          sensor::Sensor *e_import = id(s_e_import), *e_export = id(s_e_export);
          int n = (w(u_l1) > 1.0f) + (w(u_l2) > 1.0f) + (w(u_l3) > 1.0f);
          float fasen = n > 0 ? (float) n : 1.0f;
          float p_tot = w(p_l1) + w(p_l2) + w(p_l3);
          float va_tot = va(u_l1, i_l1) + va(u_l2, i_l2) + va(u_l3, i_l3);
          auto &r = id(reg);
          r[0] = w(u_l1);  // 0x0000 Spanning L1 (V)
          r[1] = w(u_l2);  // 0x0002 Spanning L2 (V)
          r[2] = w(u_l3);  // 0x0004 Spanning L3 (V)
          r[3] = w(i_l1);  // 0x0006 Stroom L1 (A)
          r[4] = w(i_l2);  // 0x0008 Stroom L2 (A)
          r[5] = w(i_l3);  // 0x000A Stroom L3 (A)
          r[6] = w(p_l1);  // 0x000C Vermogen L1 (W), afname positief, injectie negatief
          r[7] = w(p_l2);  // 0x000E Vermogen L2 (W)
          r[8] = w(p_l3);  // 0x0010 Vermogen L3 (W)
          r[9] = va(u_l1, i_l1);  // 0x0012 Schijnbaar vermogen L1 (VA)
          r[10] = va(u_l2, i_l2);  // 0x0014 Schijnbaar vermogen L2 (VA)
          r[11] = va(u_l3, i_l3);  // 0x0016 Schijnbaar vermogen L3 (VA)
          r[12] = pf(w(p_l1), va(u_l1, i_l1));  // 0x001E Arbeidsfactor L1
          r[13] = pf(w(p_l2), va(u_l2, i_l2));  // 0x0020 Arbeidsfactor L2
          r[14] = pf(w(p_l3), va(u_l3, i_l3));  // 0x0022 Arbeidsfactor L3
          r[15] = (w(u_l1) + w(u_l2) + w(u_l3)) / fasen;  // 0x002A Gemiddelde spanning (V)
          r[16] = (w(i_l1) + w(i_l2) + w(i_l3)) / fasen;  // 0x002E Gemiddelde stroom (A)
          r[17] = w(i_l1) + w(i_l2) + w(i_l3);  // 0x0030 Som van de stromen (A)
          r[18] = p_tot;  // 0x0034 Totaal vermogen (W), afname positief
          r[19] = va_tot;  // 0x0038 Totaal schijnbaar vermogen (VA)
          r[20] = pf(p_tot, va_tot);  // 0x003E Totale arbeidsfactor
          r[21] = 50.0f;  // 0x0046 Frequentie (Hz), zit niet in P1, nominaal 50 Hz
          r[22] = w(e_import);  // 0x0048 Afname totaal (kWh)
          r[23] = w(e_export);  // 0x004A Injectie totaal (kWh)
          r[24] = w(e_import) + w(e_export);  // 0x0156 Totale actieve energie (kWh)

sensor:
  # Hartslag van de dongle, komt als laatste in elk pakket
  - platform: packet_transport
    provider: ${p1_dongle}
    remote_id: link_seq
    id: seq
    internal: true
    on_value:
      - lambda: |-
          // De dongle stuurt alles om de 5 s opnieuw. Enkel een NIEUWE hartslag betekent
          // een nieuw telegram. Anders zou de failsafe nooit afgaan als de P1 kabel los
          // is terwijl de dongle zelf nog draait. Een lege hartslag (NaN, nog geen
          // telegram gezien) telt nooit.
          if (!std::isnan(x) && x != id(laatste_seq)) {
            id(laatste_seq) = x;
            id(laatste_ontvangst) = millis();
            id(telegrammen) += 1;
            id(bereken).execute();
          }
  - platform: packet_transport
    provider: ${p1_dongle}
    remote_id: link_p_l1
    id: s_p_l1
    name: "Vermogen L1"
    internal: false
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
  - platform: packet_transport
    provider: ${p1_dongle}
    remote_id: link_p_l2
    id: s_p_l2
    name: "Vermogen L2"
    internal: false
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
  - platform: packet_transport
    provider: ${p1_dongle}
    remote_id: link_p_l3
    id: s_p_l3
    name: "Vermogen L3"
    internal: false
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
  - platform: packet_transport
    provider: ${p1_dongle}
    remote_id: link_import
    id: s_e_import
    name: "Afname totaal"
    internal: false
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
  - platform: packet_transport
    provider: ${p1_dongle}
    remote_id: link_export
    id: s_e_export
    name: "Injectie totaal"
    internal: false
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
  - platform: packet_transport
    provider: ${p1_dongle}
    remote_id: p1_u_l1
    id: s_u_l1
    name: "Spanning L1"
    internal: false
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
  - platform: packet_transport
    provider: ${p1_dongle}
    remote_id: p1_u_l2
    id: s_u_l2
    name: "Spanning L2"
    internal: false
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
  - platform: packet_transport
    provider: ${p1_dongle}
    remote_id: p1_u_l3
    id: s_u_l3
    name: "Spanning L3"
    internal: false
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
  - platform: packet_transport
    provider: ${p1_dongle}
    remote_id: p1_i_l1
    id: s_i_l1
    name: "Stroom L1"
    internal: false
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
  - platform: packet_transport
    provider: ${p1_dongle}
    remote_id: p1_i_l2
    id: s_i_l2
    name: "Stroom L2"
    internal: false
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
  - platform: packet_transport
    provider: ${p1_dongle}
    remote_id: p1_i_l3
    id: s_i_l3
    name: "Stroom L3"
    internal: false
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 2

  - platform: template
    name: "Totaal vermogen naar omvormer"
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 2s
    lambda: return id(reg)[18];

  - platform: template
    name: "Telegrammen ontvangen"
    accuracy_decimals: 0
    state_class: total_increasing
    entity_category: diagnostic
    update_interval: 10s
    lambda: return id(telegrammen);

  - platform: wifi_signal
    id: wifi_rssi
    name: "WiFi signaal"
    update_interval: 60s
    entity_category: diagnostic

binary_sensor:
  - platform: template
    name: "Data van dongle"
    device_class: connectivity
    lambda: |-
      return id(laatste_ontvangst) != 0 && (millis() - id(laatste_ontvangst)) <= ${failsafe_ms};

button:
  - platform: restart
    name: "Herstarten"
    entity_category: config
