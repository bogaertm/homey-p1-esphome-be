# Growatt meter emulator: ESP32 met RS485 bij de omvormer die zich voordoet als
# Eastron SDM630 (3 fasen) of SDM230 (1 fase). De meetwaarden komen draadloos van de
# Homey Energy Dongle aan de digitale meter (homey-p1-be-growatt-link.yaml).
#
# GEGENEREERD door tools/genereer_emulator.py: pas registers daar aan, niet hier.
#
# Hardware: Waveshare ESP32-S3-RS485-CAN (DIN rail, geisoleerde RS485, 7 tot 36 V DC)
#   RS485 A en B naar de meteringang van de Growatt (bv. SYS COM pin 5 = A, pin 6 = B)
#
# Enkel voor eigenverbruik en batterijsturing. NIET gebruiken als wettelijk verplichte
# injectiebegrenzing: daarvoor eist Fluvius een begrenzer van de Synergrid C10/25 lijst.

substitutions:
  name: growatt-meter
  friendly_name: Growatt meter
  # 2 = SDM630 v2 (3 fasen, standaard bij Growatt), 1 = SDM230 (1 fase), 3 = SDM630 v3
  meter_adres: "2"
  # Na zoveel ms zonder nieuw telegram stopt de emulator met antwoorden (failsafe)
  failsafe_ms: "5000"
  # Naam van de dongle (esphome name in homey-p1-be.yaml)
  p1_dongle: homey-p1
  rs485_tx: GPIO17
  rs485_rx: GPIO18
  rs485_de: GPIO21

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.0
  project:
    name: btechnics.growatt-meter-emulator
    version: "1.0.0"

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  batch_delay: 0ms
  encryption:
    key: !secret api_key_emulator

ota:
  - platform: esphome
    encryption:
      key: !secret api_key_emulator

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  ap:
    ssid: "${name} fallback"
    password: !secret ap_password

captive_portal:

web_server:
  port: 80
  version: 3
  ota: false

globals:
  # Berekende registerwaarden, in dezelfde volgorde als de registers hieronder
  - id: reg
    type: std::array<float, 25>
    restore_value: false
  - id: laatste_seq
    type: float
    restore_value: false
    initial_value: "-1"
  - id: laatste_ontvangst
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: telegrammen
    type: uint32_t
    restore_value: false
    initial_value: "0"
  # Snuffelaar: welke vragen stelt de omvormer (adres, functiecode, startregister, aantal)
  - id: vraag_sleutel
    type: std::array<uint32_t, 16>
    restore_value: false
  - id: vraag_aantal
    type: std::array<uint32_t, 16>
    restore_value: false
  - id: onbekend_sleutel
    type: std::array<uint32_t, 8>
    restore_value: false
  - id: foutantwoorden
    type: uint32_t
    restore_value: false
    initial_value: "0"

# ---------------------------------------------------------------- link met de dongle --
udp:
  id: p1_udp
  port: 18511

packet_transport:
  - platform: udp
    udp_id: p1_udp
    providers:
      - name: ${p1_dongle}
        encryption:
          key: !secret p1_link_key

# --------------------------------------------------------------------------- RS485 --
uart:
  - id: uart_rs485
    tx_pin: ${rs485_tx}
    rx_pin: ${rs485_rx}
    baud_rate: 9600
    data_bits: 8
    parity: NONE
    stop_bits: 1
    # Snuffelaar: elke vraag van de omvormer wordt geteld en in Home Assistant getoond
    # (sensors "Vragen van omvormer" en "Vragen met lege registers"). Met logger op DEBUG
    # verschijnen ook alle ruwe bytes in de log.
    debug:
      direction: BOTH
      dummy_receiver: false
      sequence:
        - lambda: |-
            UARTDebug::log_hex(direction, bytes, ' ');
            if (direction == uart::UART_DIRECTION_TX) {
              // Ons antwoord: functiecode met hoogste bit = foutmelding
              if (bytes.size() >= 5 && (bytes[1] & 0x80)) id(foutantwoorden) += 1;
              return;
            }
            auto crc = [](const uint8_t *d, size_t n) -> uint16_t {
              uint16_t c = 0xFFFF;
              for (size_t i = 0; i < n; i++) {
                c ^= d[i];
                for (int b = 0; b < 8; b++) c = (c & 1) ? (c >> 1) ^ 0xA001 : c >> 1;
              }
              return c;
            };
            // Registers die de emulator echt invult (elk FP32 = 2 registers)
            static const uint16_t bediend[] = {0x0000, 0x0002, 0x0004, 0x0006, 0x0008, 0x000A, 0x000C, 0x000E, 0x0010, 0x0012, 0x0014, 0x0016, 0x001E, 0x0020, 0x0022, 0x002A, 0x002E, 0x0030, 0x0034, 0x0038, 0x003E, 0x0046, 0x0048, 0x004A, 0x0156};
            auto is_bediend = [&](uint16_t r) -> bool {
              for (uint16_t a : bediend) if (r == a || r == a + 1) return true;
              return false;
            };
            // Een leesvraag is altijd 8 bytes met geldige CRC
            for (size_t i = 0; i + 8 <= bytes.size(); i++) {
              if (crc(&bytes[i], 8) != 0) continue;
              uint8_t adr = bytes[i], fc = bytes[i + 1];
              uint16_t start = (bytes[i + 2] << 8) | bytes[i + 3];
              uint16_t aantal = (bytes[i + 4] << 8) | bytes[i + 5];
              uint32_t sleutel = ((uint32_t) adr << 24) | ((uint32_t) fc << 16) | start;
              // Optellen in de lijst van vragen (aantal registers zit in de hoogste bits van de teller)
              auto &k = id(vraag_sleutel);
              auto &n = id(vraag_aantal);
              for (int j = 0; j < 16; j++) {
                if (n[j] != 0 && k[j] == sleutel && (n[j] >> 20) == aantal) { n[j]++; break; }
                if (n[j] == 0) { k[j] = sleutel; n[j] = ((uint32_t) aantal << 20) | 1; break; }
              }
              // Vraag aan ons adres die we niet (volledig) kunnen beantwoorden?
              bool onbekend = false;
              if (adr == ${meter_adres}) {
                if (fc != 3 && fc != 4) onbekend = true;
                else for (uint32_t r = start; r < (uint32_t) start + aantal; r++)
                  if (!is_bediend(r)) { onbekend = true; break; }
              }
              if (onbekend) {
                auto &o = id(onbekend_sleutel);
                uint32_t ok = ((uint32_t) fc << 24) | ((uint32_t) start << 8) | (aantal & 0xFF);
                for (int j = 0; j < 8; j++) {
                  if (o[j] == ok) break;
                  if (o[j] == 0) { o[j] = ok; break; }
                }
              }
              i += 7;
            }

modbus:
  - id: rs485
    uart_id: uart_rs485
    role: server
    flow_control_pin: ${rs485_de}

modbus_server:
  - id: sdm
    modbus_id: rs485
    address: ${meter_adres}
    # Niet ingevulde registers geven 0 terug, zoals een echte SDM630
    courtesy_response:
      enabled: true
      register_last_address: 0x017F
      register_value: 0
    # Elk register: geen verse data van de dongle = foutmelding naar de omvormer
    registers:
      # 30001 Spanning L1 (V)
      - address: 0x0000
        value_type: FP32
        read_lambda: |-
          if (id(laatste_ontvangst) == 0 || millis() - id(laatste_ontvangst) > ${failsafe_ms}) return {};
          return id(reg)[0];
      # 30003 Spanning L2 (V)
      - address: 0x0002
        value_type: FP32
        read_lambda: |-
          if (id(laatste_ontvangst) == 0 || millis() - id(laatste_ontvangst) > ${failsafe_ms}) return {};
          return id(reg)[1];
      # 30005 Spanning L3 (V)
      - address: 0x0004
        value_type: FP32
        read_lambda: |-
          if (id(laatste_ontvangst) == 0 || millis() - id(laatste_ontvangst) > ${failsafe_ms}) return {};
          return id(reg)[2];
      # 30007 Stroom L1 (A)
      - address: 0x0006
        value_type: FP32
        read_lambda: |-
          if (id(laatste_ontvangst) == 0 || millis() - id(laatste_ontvangst) > ${failsafe_ms}) return {};
          return id(reg)[3];
      # 30009 Stroom L2 (A)
      - address: 0x0008
        value_type: FP32
        read_lambda: |-
          if (id(laatste_ontvangst) == 0 || millis() - id(laatste_ontvangst) > ${failsafe_ms}) return {};
          return id(reg)[4];
      # 30011 Stroom L3 (A)
      - address: 0x000A
        value_type: FP32
        read_lambda: |-
          if (id(laatste_ontvangst) == 0 || millis() - id(laatste_ontvangst) > ${failsafe_ms}) return {};
          return id(reg)[5];
      # 30013 Vermogen L1 (W), afname positief, injectie negatief
      - address: 0x000C
        value_type: FP32
        read_lambda: |-
          if (id(laatste_ontvangst) == 0 || millis() - id(laatste_ontvangst) > ${failsafe_ms}) return {};
          return id(reg)[6];
      # 30015 Vermogen L2 (W)
      - address: 0x000E
        value_type: FP32
        read_lambda: |-
          if (id(laatste_ontvangst) == 0 || millis() - id(laatste_ontvangst) > ${failsafe_ms}) return {};
          return id(reg)[7];
      # 30017 Vermogen L3 (W)
      - address: 0x0010
        value_type: FP32
        read_lambda: |-
          if (id(laatste_ontvangst) == 0 || millis() - id(laatste_ontvangst) > ${failsafe_ms}) return {};
          return id(reg)[8];
      # 30019 Schijnbaar vermogen L1 (VA)
      - address: 0x0012
        value_type: FP32
        read_lambda: |-
          if (id(laatste_ontvangst) == 0 || millis() - id(laatste_ontvangst) > ${failsafe_ms}) return {};
          return id(reg)[9];
      # 30021 Schijnbaar vermogen L2 (VA)
      - address: 0x0014
        value_type: FP32
        read_lambda: |-
          if (id(laatste_ontvangst) == 0 || millis() - id(laatste_ontvangst) > ${failsafe_ms}) return {};
          return id(reg)[10];
      # 30023 Schijnbaar vermogen L3 (VA)
      - address: 0x0016
        value_type: FP32
        read_lambda: |-
          if (id(laatste_ontvangst) == 0 || millis() - id(laatste_ontvangst) > ${failsafe_ms}) return {};
          return id(reg)[11];
      # 30031 Arbeidsfactor L1
      - address: 0x001E
        value_type: FP32
        read_lambda: |-
          if (id(laatste_ontvangst) == 0 || millis() - id(laatste_ontvangst) > ${failsafe_ms}) return {};
          return id(reg)[12];
      # 30033 Arbeidsfactor L2
      - address: 0x0020
        value_type: FP32
        read_lambda: |-
          if (id(laatste_ontvangst) == 0 || millis() - id(laatste_ontvangst) > ${failsafe_ms}) return {};
          return id(reg)[13];
      # 30035 Arbeidsfactor L3
      - address: 0x0022
        value_type: FP32
        read_lambda: |-
          if (id(laatste_ontvangst) == 0 || millis() - id(laatste_ontvangst) > ${failsafe_ms}) return {};
          return id(reg)[14];
      # 30043 Gemiddelde spanning (V)
      - address: 0x002A
        value_type: FP32
        read_lambda: |-
          if (id(laatste_ontvangst) == 0 || millis() - id(laatste_ontvangst) > ${failsafe_ms}) return {};
          return id(reg)[15];
      # 30047 Gemiddelde stroom (A)
      - address: 0x002E
        value_type: FP32
        read_lambda: |-
          if (id(laatste_ontvangst) == 0 || millis() - id(laatste_ontvangst) > ${failsafe_ms}) return {};
          return id(reg)[16];
      # 30049 Som van de stromen (A)
      - address: 0x0030
        value_type: FP32
        read_lambda: |-
          if (id(laatste_ontvangst) == 0 || millis() - id(laatste_ontvangst) > ${failsafe_ms}) return {};
          return id(reg)[17];
      # 30053 Totaal vermogen (W), afname positief
      - address: 0x0034
        value_type: FP32
        read_lambda: |-
          if (id(laatste_ontvangst) == 0 || millis() - id(laatste_ontvangst) > ${failsafe_ms}) return {};
          return id(reg)[18];
      # 30057 Totaal schijnbaar vermogen (VA)
      - address: 0x0038
        value_type: FP32
        read_lambda: |-
          if (id(laatste_ontvangst) == 0 || millis() - id(laatste_ontvangst) > ${failsafe_ms}) return {};
          return id(reg)[19];
      # 30063 Totale arbeidsfactor
      - address: 0x003E
        value_type: FP32
        read_lambda: |-
          if (id(laatste_ontvangst) == 0 || millis() - id(laatste_ontvangst) > ${failsafe_ms}) return {};
          return id(reg)[20];
      # 30071 Frequentie (Hz), zit niet in P1, nominaal 50 Hz
      - address: 0x0046
        value_type: FP32
        read_lambda: |-
          if (id(laatste_ontvangst) == 0 || millis() - id(laatste_ontvangst) > ${failsafe_ms}) return {};
          return id(reg)[21];
      # 30073 Afname totaal (kWh)
      - address: 0x0048
        value_type: FP32
        read_lambda: |-
          if (id(laatste_ontvangst) == 0 || millis() - id(laatste_ontvangst) > ${failsafe_ms}) return {};
          return id(reg)[22];
      # 30075 Injectie totaal (kWh)
      - address: 0x004A
        value_type: FP32
        read_lambda: |-
          if (id(laatste_ontvangst) == 0 || millis() - id(laatste_ontvangst) > ${failsafe_ms}) return {};
          return id(reg)[23];
      # 30343 Totale actieve energie (kWh)
      - address: 0x0156
        value_type: FP32
        read_lambda: |-
          if (id(laatste_ontvangst) == 0 || millis() - id(laatste_ontvangst) > ${failsafe_ms}) return {};
          return id(reg)[24];

script:
  # Rekent alle registerwaarden 1 keer uit per nieuw telegram
  - id: bereken
    then:
      - lambda: |-
          auto w = [](sensor::Sensor *s) -> float {
            return (s->has_state() && !std::isnan(s->state)) ? s->state : 0.0f;
          };
          auto va = [&](sensor::Sensor *u, sensor::Sensor *i) -> float { return w(u) * w(i); };
          auto pf = [](float p, float s) -> float {
            if (s < 1.0f) return 1.0f;
            float f = p / s;
            return f > 1.0f ? 1.0f : (f < -1.0f ? -1.0f : f);
          };
          sensor::Sensor *u_l1 = id(s_u_l1), *u_l2 = id(s_u_l2), *u_l3 = id(s_u_l3);
          sensor::Sensor *i_l1 = id(s_i_l1), *i_l2 = id(s_i_l2), *i_l3 = id(s_i_l3);
          sensor::Sensor *p_l1 = id(s_p_l1), *p_l2 = id(s_p_l2), *p_l3 = id(s_p_l3);
          sensor::Sensor *e_import = id(s_e_import), *e_export = id(s_e_export);
          int n = (w(u_l1) > 1.0f) + (w(u_l2) > 1.0f) + (w(u_l3) > 1.0f);
          float fasen = n > 0 ? (float) n : 1.0f;
          float p_tot = w(p_l1) + w(p_l2) + w(p_l3);
          float va_tot = va(u_l1, i_l1) + va(u_l2, i_l2) + va(u_l3, i_l3);
          auto &r = id(reg);
          r[0] = w(u_l1);  // 0x0000 Spanning L1 (V)
          r[1] = w(u_l2);  // 0x0002 Spanning L2 (V)
          r[2] = w(u_l3);  // 0x0004 Spanning L3 (V)
          r[3] = w(i_l1);  // 0x0006 Stroom L1 (A)
          r[4] = w(i_l2);  // 0x0008 Stroom L2 (A)
          r[5] = w(i_l3);  // 0x000A Stroom L3 (A)
          r[6] = w(p_l1);  // 0x000C Vermogen L1 (W), afname positief, injectie negatief
          r[7] = w(p_l2);  // 0x000E Vermogen L2 (W)
          r[8] = w(p_l3);  // 0x0010 Vermogen L3 (W)
          r[9] = va(u_l1, i_l1);  // 0x0012 Schijnbaar vermogen L1 (VA)
          r[10] = va(u_l2, i_l2);  // 0x0014 Schijnbaar vermogen L2 (VA)
          r[11] = va(u_l3, i_l3);  // 0x0016 Schijnbaar vermogen L3 (VA)
          r[12] = pf(w(p_l1), va(u_l1, i_l1));  // 0x001E Arbeidsfactor L1
          r[13] = pf(w(p_l2), va(u_l2, i_l2));  // 0x0020 Arbeidsfactor L2
          r[14] = pf(w(p_l3), va(u_l3, i_l3));  // 0x0022 Arbeidsfactor L3
          r[15] = (w(u_l1) + w(u_l2) + w(u_l3)) / fasen;  // 0x002A Gemiddelde spanning (V)
          r[16] = (w(i_l1) + w(i_l2) + w(i_l3)) / fasen;  // 0x002E Gemiddelde stroom (A)
          r[17] = w(i_l1) + w(i_l2) + w(i_l3);  // 0x0030 Som van de stromen (A)
          r[18] = p_tot;  // 0x0034 Totaal vermogen (W), afname positief
          r[19] = va_tot;  // 0x0038 Totaal schijnbaar vermogen (VA)
          r[20] = pf(p_tot, va_tot);  // 0x003E Totale arbeidsfactor
          r[21] = 50.0f;  // 0x0046 Frequentie (Hz), zit niet in P1, nominaal 50 Hz
          r[22] = w(e_import);  // 0x0048 Afname totaal (kWh)
          r[23] = w(e_export);  // 0x004A Injectie totaal (kWh)
          r[24] = w(e_import) + w(e_export);  // 0x0156 Totale actieve energie (kWh)

sensor:
  # Hartslag van de dongle, komt als laatste in elk pakket
  - platform: packet_transport
    provider: ${p1_dongle}
    remote_id: link_seq
    id: seq
    internal: true
    on_value:
      - lambda: |-
          // De dongle stuurt alles om de 5 s opnieuw. Enkel een NIEUWE hartslag betekent
          // een nieuw telegram. Anders zou de failsafe nooit afgaan als de P1 kabel los
          // is terwijl de dongle zelf nog draait. Een lege hartslag (NaN, nog geen
          // telegram gezien) telt nooit.
          if (!std::isnan(x) && x != id(laatste_seq)) {
            id(laatste_seq) = x;
            id(laatste_ontvangst) = millis();
            id(telegrammen) += 1;
            id(bereken).execute();
          }
  - platform: packet_transport
    provider: ${p1_dongle}
    remote_id: link_p_l1
    id: s_p_l1
    name: "Vermogen L1"
    internal: false
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
  - platform: packet_transport
    provider: ${p1_dongle}
    remote_id: link_p_l2
    id: s_p_l2
    name: "Vermogen L2"
    internal: false
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
  - platform: packet_transport
    provider: ${p1_dongle}
    remote_id: link_p_l3
    id: s_p_l3
    name: "Vermogen L3"
    internal: false
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
  - platform: packet_transport
    provider: ${p1_dongle}
    remote_id: link_import
    id: s_e_import
    name: "Afname totaal"
    internal: false
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
  - platform: packet_transport
    provider: ${p1_dongle}
    remote_id: link_export
    id: s_e_export
    name: "Injectie totaal"
    internal: false
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
  - platform: packet_transport
    provider: ${p1_dongle}
    remote_id: p1_u_l1
    id: s_u_l1
    name: "Spanning L1"
    internal: false
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
  - platform: packet_transport
    provider: ${p1_dongle}
    remote_id: p1_u_l2
    id: s_u_l2
    name: "Spanning L2"
    internal: false
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
  - platform: packet_transport
    provider: ${p1_dongle}
    remote_id: p1_u_l3
    id: s_u_l3
    name: "Spanning L3"
    internal: false
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
  - platform: packet_transport
    provider: ${p1_dongle}
    remote_id: p1_i_l1
    id: s_i_l1
    name: "Stroom L1"
    internal: false
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
  - platform: packet_transport
    provider: ${p1_dongle}
    remote_id: p1_i_l2
    id: s_i_l2
    name: "Stroom L2"
    internal: false
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
  - platform: packet_transport
    provider: ${p1_dongle}
    remote_id: p1_i_l3
    id: s_i_l3
    name: "Stroom L3"
    internal: false
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 2

  - platform: template
    name: "Totaal vermogen naar omvormer"
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 2s
    lambda: return id(reg)[18];

  - platform: template
    name: "Telegrammen ontvangen"
    accuracy_decimals: 0
    state_class: total_increasing
    entity_category: diagnostic
    update_interval: 10s
    lambda: return id(telegrammen);

  - platform: template
    name: "Foutantwoorden naar omvormer"
    accuracy_decimals: 0
    state_class: total_increasing
    entity_category: diagnostic
    update_interval: 10s
    lambda: return id(foutantwoorden);

  - platform: wifi_signal
    id: wifi_rssi
    name: "WiFi signaal"
    update_interval: 60s
    entity_category: diagnostic

text_sensor:
  # Wat de omvormer vraagt: functiecode/adres startregister+aantal xkeer
  - platform: template
    name: "Vragen van omvormer"
    entity_category: diagnostic
    update_interval: 10s
    lambda: |-
      std::string uit;
      char buf[40];
      for (int j = 0; j < 16; j++) {
        uint32_t n = id(vraag_aantal)[j];
        if (n == 0) break;
        uint32_t k = id(vraag_sleutel)[j];
        snprintf(buf, sizeof(buf), "%s%02X/%u %04X+%u x%u", uit.empty() ? "" : ", ",
                 (unsigned) ((k >> 16) & 0xFF), (unsigned) (k >> 24), (unsigned) (k & 0xFFFF),
                 (unsigned) (n >> 20), (unsigned) (n & 0xFFFFF));
        if (uit.size() + strlen(buf) > 250) break;
        uit += buf;
      }
      return uit.empty() ? std::string("nog geen vragen") : uit;

  # Vragen aan ons adres met registers die de emulator niet invult (krijgen 0 of een foutmelding)
  - platform: template
    name: "Vragen met lege registers"
    entity_category: diagnostic
    update_interval: 10s
    lambda: |-
      std::string uit;
      char buf[24];
      for (int j = 0; j < 8; j++) {
        uint32_t o = id(onbekend_sleutel)[j];
        if (o == 0) break;
        snprintf(buf, sizeof(buf), "%s%02X %04X+%u", uit.empty() ? "" : ", ",
                 (unsigned) (o >> 24), (unsigned) ((o >> 8) & 0xFFFF), (unsigned) (o & 0xFF));
        uit += buf;
      }
      return uit.empty() ? std::string("geen") : uit;

binary_sensor:
  - platform: template
    name: "Data van dongle"
    device_class: connectivity
    lambda: |-
      return id(laatste_ontvangst) != 0 && (millis() - id(laatste_ontvangst)) <= ${failsafe_ms};

button:
  - platform: restart
    name: "Herstarten"
    entity_category: config
